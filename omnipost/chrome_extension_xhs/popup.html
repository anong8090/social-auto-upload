<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 350px;
        margin: 0;
        padding: 14px;
        font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #0b132b;
        background: #f4f8fc;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .platform { color: #52607a; margin-bottom: 10px; }
      label { display: block; margin: 8px 0 4px; color: #52607a; }
      select {
        width: 100%; box-sizing: border-box; padding: 6px 8px;
        border: 1px solid #cfd8e6; border-radius: 6px; background: #fff;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1; padding: 8px 10px; border: 0; border-radius: 6px;
        background: #0b132b; color: #fff; font-size: 13px; cursor: pointer;
      }
      button.secondary { background: #dce7f5; color: #0b132b; }
      button:disabled { opacity: .5; cursor: default; }
      #status { margin-top: 10px; white-space: pre-wrap; color: #33415c; }
      .title { margin-top: 10px; font-weight: 600; }
      .hint { margin-top: 8px; color: #7b879c; }
    </style>
  </head>
  <body>
    <h1>河狸云个人 IP · 填入</h1>
    <div class="platform" id="platform">正在识别当前页…</div>
    <label for="source">内容来源</label>
    <select id="source"></select>
    <div class="row">
      <button id="load" class="secondary">读取内容</button>
      <button id="fill" disabled>填入当前页</button>
    </div>
    <div class="title" id="title"></div>
    <div class="hint" id="meta"></div>
    <div id="status"></div>
    <div class="hint">
      只填不发布：填完自己核对配图与声明，再点平台自己的发布按钮。
      需先启动：<code>omnipost/scripts/xhs_fill_bridge.py</code>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
